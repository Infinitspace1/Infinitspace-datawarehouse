name: Deploy Location Scraper

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FUNCTION_APP_NAME: "func-infinitspace-etl"
  RESOURCE_GROUP: "infinitspace-prod-northeurope-data-rg"
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "."

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run location scraper tests
        env:
          # Minimal env so SQLClient doesn't fail at import time
          AZURE_SQL_CONNECTION_STRING: "Driver={ODBC Driver 18 for SQL Server};Server=localhost;Database=test;UID=sa;PWD=test;"
          APIFY_TOKEN: "dummy"
          LUSHA_API_KEY: "dummy"
        run: |
          python -m pytest tests/test_location_scraper_resolve_source.py \
                           tests/test_location_scraper_idealista_e2e.py \
                           tests/test_location_scraper_run_health.py \
                           -v --tb=short

  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ODBC driver (required for pyodbc wheel build)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6651F39686B04788AF9A53C78632929F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7EF5B56F14DE4AA3A8E58D4A379D1354 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_07D1E39F7A4646E09728B5DAB7EC285D }}

      - name: Enable location scraper functions on Function App
        run: |
          az functionapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --settings ENABLE_LOCATION_SCRAPER_FUNCTIONS=1

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Verify deployment
        run: |
          echo "Deployed to ${{ env.FUNCTION_APP_NAME }}"
          az functionapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --query "{state:state, defaultHostName:defaultHostName}" \
            -o table
